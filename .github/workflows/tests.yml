name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests without desktop or downloaded models
        run: python -m pytest -m "not gui and not model" -ra

  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run GUI tests without downloaded models
        run: python -m pytest -m "gui and not model" -ra
